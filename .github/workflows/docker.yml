name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/p1zzm1ssile/evictarr

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(awk -F\" '/__version__/ {print $2}' src/utils/version.py | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: evictarr:test

      - name: Check the image starts and the web UI answers
        run: |
          docker run --rm evictarr:test python -c "import utils.daemons, utils.web, healthcheck; print('Evictarr loads')"
          docker run -d --name smoke -p 9891:9891 evictarr:test
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:9891/login && break || sleep 1; done
          # A fresh install sends you to create an account, and the API needs a login
          curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" http://localhost:9891/ | tee /tmp/root
          grep -q "302 http://localhost:9891/setup" /tmp/root
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9891/api/settings)" = "401"
          docker logs smoke
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published as a plain Docker v2 manifest without build attestations. With
      # them, the image is an OCI index that Unraid's update check can't read, so
      # Unraid never sees new versions.
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Check Unraid can read the published image
        run: |
          # Unraid's update check asks for a Docker v2 manifest; it must not 404
          token=$(curl -s "https://ghcr.io/token?scope=repository:p1zzm1ssile/evictarr:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/p1zzm1ssile/evictarr/manifests/${{ steps.version.outputs.version }}")
          echo "Docker v2 manifest: HTTP $code"
          test "$code" = "200"
